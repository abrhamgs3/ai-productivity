[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-productivity"
version = "0.1.0"
description = "Panel econometrics research pipeline: AI adoption and total factor productivity"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ab", email = "abrhamgs3@gmail.com" }]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "statsmodels>=0.14",
    "linearmodels>=5.3",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
app = [
    "streamlit>=1.35",
]
ai = [
    "openai>=1.0",
    "langchain>=0.2",
]

[project.scripts]
ai-productivity = "ai_productivity.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_productivity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --import-mode=importlib"
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
