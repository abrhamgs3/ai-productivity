# =============================================================================
# Sprint 2 — Reference Output Manifest
# tests/fixtures/reference_outputs/manifest.yaml
#
# Ground truth artifact registry for the AI & Productivity research pipeline.
# Captured 2026-06-23 from refactor-platform branch before Sprint 3+ changes.
#
# Provenance groups
# -----------------
# A  src/ai_productivity/pipeline.py run()   produced 2026-06-21
# B  scripts/ numbered ad-hoc scripts        produced 2026-03-11
# C  Intermediate data required for reproducibility
# =============================================================================

sprint: 2
captured_date: "2026-06-23"
input_data: "data/processed/panel_clean.csv"
input_sha256: "9a65183a5406c76be2ba840faacbef673aa1b09604a1d61b8fe29c34415ebe44"
input_rows: 2895
input_countries: 193
input_years: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
random_seed: 42

anomalies:
  - id: ANOM-01
    severity: scientific
    description: >
      tables/pwt_only_fe.txt and tables/solow_excl_fe.txt are byte-identical
      (SHA256 891ce892...). Both filter tfp_solow_flag==0 with identical regressors
      and FE structure. pwt_only_fe is from run_sensitivity_suite();
      solow_excl_fe is from run_heterogeneity_suite(). The two slots were intended
      to represent different checks but produce the same result. Must be resolved
      before Sprint 3.
    files: ["tables/pwt_only_fe.txt", "tables/solow_excl_fe.txt"]

  - id: ANOM-02
    severity: provenance
    description: >
      tables/tfp_regression.txt was produced by scripts/04_regressions.py on an
      older dataset (364 observations, 61 entities). Current panel_clean.csv has
      2895 rows / 193 countries. Not reproducible from current data.
    files: ["tables/tfp_regression.txt"]

  - id: ANOM-03
    severity: provenance
    description: >
      tables/summary_stats.tex was produced by scripts/07_tables.py on a dataset
      state from 2026-03-11. Row counts (ln_ai=692, ln_tfp=1020) do not match
      current panel_clean.csv. Not reproducible from current data.
    files: ["tables/summary_stats.tex"]

  - id: ANOM-04
    severity: ambiguity
    description: >
      figures/ai_tfp_trend.png can be produced by two different code paths.
      Path 1 (current): src/ai_productivity/visualization/figures.py ai_tfp_trend()
      -- dual-axis, Times font, publication style, also writes .pdf.
      Path 2: scripts/06_figures.py -- single axis, default matplotlib style,
      .png only. The two outputs are visually and bytes-different. Current artifact
      is from Path 1.
    files: ["figures/ai_tfp_trend.png", "figures/ai_tfp_trend.pdf"]

  - id: ANOM-05
    severity: gap
    description: >
      run_pipeline.py does NOT call run_heterogeneity_suite(). The 7 heterogeneity
      model summaries and heterogeneity_summary.csv/.tex were produced by
      src/ai_productivity/pipeline.py run(). run_pipeline.py cannot reproduce the
      full published artifact set. Resolution required before Sprint 3.
    files:
      - "tables/pre_2020_fe.txt"
      - "tables/post_2020_fe.txt"
      - "tables/covid_interact_fe.txt"
      - "tables/post_chatgpt_fe.txt"
      - "tables/no_covid_fe.txt"
      - "tables/solow_excl_fe.txt"
      - "tables/ai_hc_interact_fe.txt"
      - "tables/heterogeneity_summary.csv"
      - "tables/heterogeneity_summary.tex"

